services:
  postgres:
    image: postgres:16
    ports:
      - "5555:5432"
    environment:
      POSTGRES_USER: magiklead
      POSTGRES_PASSWORD: magiklead
      POSTGRES_DB: magiklead
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: magiklead
      MINIO_ROOT_PASSWORD: magiklead-secret
    volumes:
      - miniodata:/data
    command: server /data --console-address ":9001"

volumes:
  pgdata:
  miniodata:
