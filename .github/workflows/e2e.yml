name: e2e

# Phase 4 of the real-product-release PRD. Walks the 15 D-bar
# flows end-to-end against a live devpod on every PR + nightly
# at 02:17 UTC. Artefacts (per-spec screenshot + DB JSON
# snapshot) upload regardless of pass/fail so the operator's
# 30-second post-CI review is "scroll the artefacts, look for
# surprises."
#
# Real-creds upgrades (Gmail Workspace, Stripe Live, PDL) are
# gated by GitHub secrets. Absent any of them, the corresponding
# (real creds) specs skip and the AFK substitute path proves the
# integration up to the third-party boundary.

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'tests/e2e/**'
      - 'devpod/**'
      - '.github/workflows/e2e.yml'
  schedule:
    # 02:17 UTC nightly — out of the hourly cron pile-up.
    - cron: '17 2 * * *'
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: 15-flow walk
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install devpods CLI
        run: |
          curl -fsSL https://github.com/jcleira/devpods/releases/latest/download/devpods-linux-x64 -o /usr/local/bin/devpods
          chmod +x /usr/local/bin/devpods

      - name: Provision devpod
        env:
          CLERK_SECRET_KEY: ${{ secrets.CLERK_DEV_SECRET_KEY }}
          CLERK_WEBHOOK_SECRET: ${{ secrets.CLERK_DEV_WEBHOOK_SECRET }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_DEV_PUBLISHABLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ADMIN_EMAILS: ci@magiklead.com
          UNSUBSCRIBE_SIGNING_SECRET: ${{ secrets.UNSUBSCRIBE_SIGNING_SECRET }}
          UNSUBSCRIBE_MAIL_DOMAIN: mail.ci.magiklead.com
          PDL_API_KEY: ${{ secrets.PDL_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REDIRECT_URI: http://api-ci.magiklead.localhost/api/gmail/callback
        run: |
          mkdir -p "$HOME/.config/devpods/magiklead"
          cat > "$HOME/.config/devpods/magiklead/.env.backend" <<EOF
          CLERK_SECRET_KEY=$CLERK_SECRET_KEY
          CLERK_WEBHOOK_SECRET=$CLERK_WEBHOOK_SECRET
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
          ANTHROPIC_API_KEY=$ANTHROPIC_API_KEY
          ADMIN_EMAILS=$ADMIN_EMAILS
          UNSUBSCRIBE_SIGNING_SECRET=$UNSUBSCRIBE_SIGNING_SECRET
          UNSUBSCRIBE_MAIL_DOMAIN=$UNSUBSCRIBE_MAIL_DOMAIN
          PDL_API_KEY=$PDL_API_KEY
          GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID
          GOOGLE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET
          GOOGLE_REDIRECT_URI=$GOOGLE_REDIRECT_URI
          EOF
          devpods up --name ci

      - name: Seed canonical fixture
        run: devpods exec --name ci api go run ./cmd/seed

      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: tests/e2e/pnpm-lock.yaml

      - name: Install e2e deps
        working-directory: tests/e2e
        run: pnpm install --frozen-lockfile

      - name: Install Playwright chromium
        working-directory: tests/e2e
        run: pnpm exec playwright install --with-deps chromium

      - name: Write .env.e2e
        working-directory: tests/e2e
        env:
          CLERK_SECRET_KEY: ${{ secrets.CLERK_DEV_SECRET_KEY }}
          E2E_REAL_GMAIL: ${{ secrets.E2E_REAL_GMAIL }}
          E2E_REAL_STRIPE: ${{ secrets.E2E_REAL_STRIPE }}
          E2E_REAL_PDL: ${{ secrets.E2E_REAL_PDL }}
        run: |
          cat > .env.e2e <<EOF
          CLERK_SECRET_KEY=$CLERK_SECRET_KEY
          E2E_API_URL=http://api-ci.magiklead.localhost
          E2E_FRONTEND_URL=http://ci.magiklead.localhost
          ${E2E_REAL_GMAIL:+E2E_REAL_GMAIL=$E2E_REAL_GMAIL}
          ${E2E_REAL_STRIPE:+E2E_REAL_STRIPE=$E2E_REAL_STRIPE}
          ${E2E_REAL_PDL:+E2E_REAL_PDL=$E2E_REAL_PDL}
          EOF

      - name: Run e2e suite (CI fails on any flow failure)
        working-directory: tests/e2e
        env:
          CI: 'true'
        run: pnpm e2e

      - name: Upload artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artefacts-${{ github.run_id }}
          path: |
            tests/e2e/artefacts/
            tests/e2e/playwright-report/
            tests/e2e/test-results/
          retention-days: 14

      - name: Tear down devpod
        if: always()
        run: devpods down --name ci --force
